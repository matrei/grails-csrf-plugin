import org.apache.grails.gradle.publish.GrailsPublishExtension

plugins {
    id 'build.config.grails-plugin'
}

dependencies {

    compileOnly 'org.apache.grails:grails-core' // Provided
    compileOnly 'org.apache.grails.views:grails-web-taglib' // Provided
    compileOnly 'org.springframework:spring-context' // Provided
    compileOnly 'org.springframework:spring-web' // Provided
    compileOnly 'org.springframework.security:spring-security-core' // Optional
    compileOnly 'org.springframework.security:spring-security-web' // Optional

    compileOnly 'org.apache.groovy:groovy' // Provided
    compileOnly 'jakarta.servlet:jakarta.servlet-api' // Provided

    testImplementation 'org.apache.grails:grails-testing-support-web'
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.springframework.security:spring-security-web'

    testRuntimeOnly 'org.slf4j:slf4j-nop' // Get rid of warning about missing slf4j implementation during test task
}

extensions.configure(GrailsPublishExtension) {
    it.title = 'Grails Plugin for CSRF protection'
    it.desc = 'Provides CSRF protection for Grails applications.'
    it.license.name = 'Apache-2.0'
    it.githubSlug = 'matrei/grails-csrf-plugin'
    it.developers = [
            matrei: 'Mattias Reichel',
    ]
}

