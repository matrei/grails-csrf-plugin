name: Tests
on:
  push:
    branches:
      - '[1-9]+.[0-9]+.x'
  pull_request:
    branches:
      - '[1-9]+.[0-9]+.x'
  workflow_dispatch:
env:
  GRAILS_PUBLISH_RELEASE: 'false'
  JAVA_DISTRIBUTION: liberica
jobs:
  check:
    name: "Test Project"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        grailsEnv: ['test', 'configtest']
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
      - name: "📝 Export .sdkmanrc properties to environment variables"
        uses: apache/grails-github-actions/export-gradle-properties@asf
        with:
          file: ".sdkmanrc"
          prefix: "SDKMANRC_"
      - name: "☕️ Determine Java version from .sdkmanrc"
        run: echo "JAVA_VERSION=${{ env.SDKMANRC_java }}" | sed 's/-.*//' >> $GITHUB_ENV
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: yes
      - name: "🏃‍♂️ Run Tests"
        run: ./gradlew check --continue -Dgrails.env=${{ matrix.grailsEnv }}